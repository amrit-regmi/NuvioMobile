name: Build iOS (unsigned, for AltServer sideload)

# Produces an UNSIGNED .ipa of the Full flavour for the free-Apple-ID / AltServer-Linux
# sideload path. CI does NOT sign — AltServer (on the Debian home server) re-signs the
# .ipa with your free Apple ID at install time and auto-refreshes it every 7 days.
#
# The .ipa is uploaded as a workflow ARTIFACT (not a public GitHub Release) because it is
# an unsigned personal build. Download it on the home server via `gh run download`.
#
# The Downloads widget / Live Activity extension is STRIPPED from the .ipa: free Apple IDs
# cannot provision App Groups / ActivityKit entitlements, so leaving the .appex in would
# make AltServer's install fail. Re-enable it only when moving to a paid ($99) account.
#
# REQUIRED repository secret:
#   APP_CONFIG_PROPERTIES   the same production app-config block used by release-mobile.yml
#                           (NUVIO_SUPABASE_URL / _ANON_KEY, SUPABASE_URL / _ANON_KEY,
#                            FASTAPI_BASE_URL, INTRODB_API_URL, …). No signing secrets needed.

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "iOS flavour to build"
        type: choice
        options: ["full", "appstore"]
        default: "full"
  # Push to the dedicated ci/ios-build branch to trigger a build without
  # placing this workflow on the default branch (main). Defaults to the Full
  # flavour (see DIST below) since push events carry no workflow inputs.
  push:
    branches: [ci/ios-build]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64 runner (7GB RAM, always available). The 14GB Intel macos-13 image is
    # deprecated and never dequeues on free capacity, so instead of chasing more
    # RAM we build the K/N framework in Debug config (see Archive step): its
    # working set fits 7GB comfortably because it skips the memory-heavy release
    # LLVM optimization that OOM-killed the Release compile here.
    runs-on: macos-15
    env:
      DIST: ${{ inputs.distribution || 'full' }}   # 'full' on push events (no inputs)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # NOT recursive: the tree has orphaned gitlinks
                              # (libass-android, vendor/*) with no .gitmodules url that
                              # break recursive init and are irrelevant to iOS.

      - name: Init MPVKit submodule only
        run: |
          # Only MPVKit is defined in .gitmodules and needed by the iOS build.
          git submodule update --init --force --depth=1 MPVKit
          ls -la MPVKit | head -5

      - name: Materialize MPVKit prebuilt xcframeworks
        run: |
          set -euo pipefail
          # MPVKit/dist is gitignored, so the non-GPL binary targets the app links
          # (Lib{mpv,av*,sw*} + Libplacebo) are absent from the checkout. Download the
          # matching prebuilt xcframeworks instead of compiling from source (make build).
          XCF="MPVKit/dist/release/xcframework"
          mkdir -p "$XCF"
          # Derive versions from the pinned submodule so this stays correct across bumps.
          MPV_TAG=$(grep -oE 'mpvkit/MPVKit/releases/download/[0-9.]+/' MPVKit/Package.swift \
                    | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          # Libplacebo MUST match the ABI the prebuilt Libmpv release was linked against — NOT the
          # version in BuildScripts/main.swift, which is the (drifted-ahead) source-build pin. The
          # prebuilt Libmpv 0.41.0 references version-mangled libplacebo symbols (e.g.
          # _pl_log_create_351); libplacebo mangles by PL_API_VER = the MIDDLE version component
          # (7.<PL_API_VER>.<fix>), so it needs libplacebo 7.351.x. Using main.swift's 7.360.1
          # (API 360) left _pl_log_create_351 undefined → "symbol(s) not found for arm64" at link.
          # If MPV_TAG is bumped, re-derive this from the new Libmpv's `nm` pl_* symbol version.
          PLACEBO_TAG=7.351.0
          echo "MPVKit=$MPV_TAG  libplacebo=$PLACEBO_TAG (ABI-matched to Libmpv $MPV_TAG)"
          fetch() { echo "downloading $2"; curl -fSL --retry 3 --retry-delay 2 -o "$1" "$2"; }
          for fw in Libmpv Libavcodec Libavdevice Libavformat Libavfilter Libavutil Libswresample Libswscale; do
            fetch "$RUNNER_TEMP/$fw.zip" "https://github.com/mpvkit/MPVKit/releases/download/$MPV_TAG/$fw.xcframework.zip"
            unzip -oq "$RUNNER_TEMP/$fw.zip" -d "$XCF"
          done
          fetch "$RUNNER_TEMP/Libplacebo.zip" "https://github.com/mpvkit/libplacebo-build/releases/download/$PLACEBO_TAG/Libplacebo.xcframework.zip"
          unzip -oq "$RUNNER_TEMP/Libplacebo.zip" -d "$XCF"
          echo "== xcframeworks present =="; ls -1 "$XCF"
          for fw in Libmpv Libavcodec Libavdevice Libavformat Libavfilter Libavutil Libswresample Libswscale Libplacebo; do
            test -d "$XCF/$fw.xcframework" || { echo "::error::missing $fw.xcframework"; exit 1; }
          done

      - name: Read version from Version.xcconfig
        id: ver
        run: |
          MARKETING_VERSION=$(grep -E '^MARKETING_VERSION=' iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')
          PROJECT_VERSION=$(grep -E '^CURRENT_PROJECT_VERSION=' iosApp/Configuration/Version.xcconfig | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building iOS v${MARKETING_VERSION} (${PROJECT_VERSION}) — flavour ${{ env.DIST }}"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"       # the Xcode Run Script (embedAndSignAppleFrameworkForXcode) expects 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3   # composeApp applies AGP; sdk.dir/ANDROID_HOME needed at configure time

      - name: Provision app config + select iOS flavour
        env:
          APP_CONFIG_PROPERTIES: ${{ secrets.APP_CONFIG_PROPERTIES }}
        run: |
          if [ -z "$APP_CONFIG_PROPERTIES" ]; then
            echo "::error::APP_CONFIG_PROPERTIES secret is not set — refusing to build with committed fallback config."
            exit 1
          fi
          printf '\n%s\n' "$APP_CONFIG_PROPERTIES" >> local.properties
          # Force the Full flavour (build.gradle defaults to 'appstore'; the Xcode Run Script
          # does not pass -P, so it must come from local.properties via supabaseProps).
          echo "NUVIO_IOS_DISTRIBUTION=${{ env.DIST }}" >> local.properties
          # gradle.properties pins an aarch64 AAPT2 path that only exists on the dev box; drop it.
          sed -i '' '/android.aapt2FromMavenOverride/d' gradle.properties || true
          # Right-size JVM heaps for the ~7GB arm64 runner. The committed values in
          # gradle.properties (gradle 8g + kotlin daemon 6g + native 12g = 26g) are tuned for
          # the 24GB dev box and overcommit the runner. Run the Kotlin/Native compiler
          # in-process in a single Gradle JVM capped at 5g — ample for the Debug framework
          # build, which (unlike Release) does not run the memory-heavy LLVM optimizer.
          # Appended keys win (last value in gradle.properties takes effect).
          {
            echo ''
            echo '# --- CI heap overrides (arm64 runner ~7GB, Debug framework) ---'
            echo 'kotlin.native.disableCompilerDaemon=true'
            echo 'org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m'
            echo 'kotlin.daemon.jvmargs=-Xmx1024M'
            echo 'kotlin.native.jvmArgs=-Xmx5g'
            echo 'org.gradle.workers.max=1'
          } >> gradle.properties
          echo "local.properties now has $(grep -c '=' local.properties) keys; flavour=${{ env.DIST }}"
          echo "== effective heap-related gradle.properties (last wins) =="; grep -nE 'jvmargs|jvmArgs|disableCompilerDaemon|workers.max' gradle.properties

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          # Debug configuration: the Kotlin/Native Release framework compile needs >7GB and
          # OOM-kills this runner; the Debug framework skips LLVM optimization and fits. The
          # produced app is fully functional (larger/slower) — fine for a personal sideload.
          # ONLY_ACTIVE_ARCH=NO so the generic iOS destination still builds device arm64.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nuvio.xcarchive" \
            archive \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | xcpretty || xcodebuild \
            -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Nuvio.xcarchive" archive \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa (widget stripped)
        id: ipa
        run: |
          APP=$(ls -d "$RUNNER_TEMP/Nuvio.xcarchive/Products/Applications/"*.app | head -1)
          echo "Archived app: $APP"
          WORK="$RUNNER_TEMP/ipa"
          rm -rf "$WORK" && mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/"
          # Strip app extensions (Downloads widget / Live Activity) — unsignable on a free Apple ID.
          rm -rf "$WORK/Payload/"*.app/PlugIns "$WORK/Payload/"*.app/Watch 2>/dev/null || true
          OUT="CineX-ios-v${{ steps.ver.outputs.version }}-${{ env.DIST }}-unsigned.ipa"
          ( cd "$WORK" && zip -qry "$RUNNER_TEMP/$OUT" Payload )
          ls -lh "$RUNNER_TEMP/$OUT"
          echo "path=$RUNNER_TEMP/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14
          if-no-files-found: error
